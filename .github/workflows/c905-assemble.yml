name: C905 assemble transport payload

on:
  push:
    branches:
      - transport/c905-upload
    paths:
      - .github/workflows/c905-assemble.yml

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout transport branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble and verify exact C905 patch payload
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .c905-transport/chunk00.b64 \
            .c905-transport/chunk01.b64 \
            .c905-transport/chunk02.b64 \
            .c905-transport/chunk03.b64 \
            .c905-transport/chunk04.b64 \
            > .c905-transport/c905-source.patch.xz.b64

          base64 -d .c905-transport/c905-source.patch.xz.b64 > /tmp/c905-source.patch.xz
          echo "3860c70caabffdfc73c39dc1fc105bc7ad1f540b5f445617b228091b60023c7a  /tmp/c905-source.patch.xz" | sha256sum -c -
          xz -t /tmp/c905-source.patch.xz

          git config user.name "GlobalNewsAI Release Automation"
          git config user.email "release-bot@users.noreply.github.com"
          git add -f .c905-transport/c905-source.patch.xz.b64
          if git diff --cached --quiet; then
            echo "Payload already exact; nothing to commit."
            exit 0
          fi
          git commit -m "transport: assemble exact C905 patch payload"
          git push origin HEAD:refs/heads/transport/c905-upload
