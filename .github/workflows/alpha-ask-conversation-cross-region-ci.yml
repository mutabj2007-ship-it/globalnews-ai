name: Alpha Ask Conversation Cross-Region CI

on:
  push:
    branches:
      - fix/alpha-ask-conversation-cross-region-r1
      - fix/alpha-ask-relational-retained-r2

concurrency:
  group: alpha-ask-conversation-cross-region
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - run: npx prisma generate --config backend/prisma.config.ts
      - run: npm run build:shared
      - name: Ask retrieval regressions
        run: |
          npm test --workspace=backend -- --runInBand src/modules/analysis/query/derive-relational-search-queries.util.spec.ts
          npm test --workspace=backend -- --runInBand src/modules/analysis/service/natural-query-routing.spec.ts -t "cross-region impact|second-turn"
      - name: Ask conversation and phone regressions
        run: |
          npm test --workspace=frontend -- --runInBand src/components/ask/askAiDock.spec.ts
          npm test --workspace=frontend -- --runInBand src/components/analysis-frame/phoneWidthFrame.spec.ts
      - name: Frontend build
        run: npm run build:frontend
      - name: Backend build
        run: npm run build:backend
