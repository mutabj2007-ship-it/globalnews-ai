name: Alpha System Convergence Audit CI

on:
  push:
    branches:
      - fix/alpha-system-convergence-audit-r1

concurrency:
  group: alpha-system-convergence-audit
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - run: npx prisma generate --config backend/prisma.config.ts
      - run: npm run build:shared
      - name: Map and Conflict regression tests
        run: |
          npm test --workspace=frontend -- --runInBand src/lib/map/d1/conflictDomainBind.spec.ts
          npm test --workspace=frontend -- --runInBand src/components/map/checkpointELayerReasons.spec.ts
          npm test --workspace=frontend -- --runInBand src/lib/map/reference/referenceGeography.spec.ts
          npm test --workspace=frontend -- --runInBand src/lib/energy/energyVisualFrame.spec.ts
          npm test --workspace=frontend -- --runInBand src/lib/market/mktReader.spec.ts
          npm test --workspace=frontend -- --runInBand src/lib/market/mktContract.spec.ts
          npm test --workspace=frontend -- --runInBand src/components/home/HomepageSituationMap.spec.ts
          npm test --workspace=frontend -- --runInBand src/lib/intelligenceModules.spec.ts
          npm test --workspace=frontend -- --runInBand src/components/home/TodayGeographicIntelligence.spec.ts
      - name: Dashboard regression sweep
        run: |
          npm test --workspace=frontend -- --runInBand src/lib/specialist/alphaVisualFrames.spec.ts
          npm test --workspace=frontend -- --runInBand src/lib/specialist/specialistVisualFrames.spec.ts
          npm test --workspace=frontend -- --runInBand src/lib/politics/politicsVisualFrame.spec.ts
          npm test --workspace=frontend -- --runInBand src/lib/security/securityVisualFrame.spec.ts
          npm test --workspace=frontend -- --runInBand src/lib/humanitarian/humContract.spec.ts
          npm test --workspace=frontend -- --runInBand src/lib/economy/b4aEconomySubstrate.spec.ts
          npm test --workspace=frontend -- --runInBand src/lib/specialist/previewScopeRuling.spec.ts
          npm test --workspace=frontend -- --runInBand src/lib/market/marketSyntheticHarness.spec.ts
      - name: Phone and compact-device regression sweep
        run: |
          npm test --workspace=frontend -- --runInBand src/components/analysis-frame/phoneWidthFrame.spec.ts
          npm test --workspace=frontend -- --runInBand src/components/analysis-frame/r4Responsive.spec.ts
          npm test --workspace=frontend -- --runInBand src/components/home/mobileVisualPass.spec.ts
          npm test --workspace=frontend -- --runInBand src/components/home/responsiveAccessibilityHardening.spec.ts
          npm test --workspace=frontend -- --runInBand src/components/map/mobile/compactSpatialCorrection.spec.ts
          npm test --workspace=frontend -- --runInBand src/components/map/mobile/mobilePlaceSearchKeyboard.spec.ts
          npm test --workspace=frontend -- --runInBand src/components/navigation/mobileNavViewport.spec.ts
      - name: Frontend build
        run: npm run build:frontend
      - name: Backend build
        run: npm run build:backend
