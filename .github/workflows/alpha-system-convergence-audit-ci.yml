name: Alpha System Convergence Audit CI

on:
  push:
    branches:
      - fix/alpha-system-convergence-audit-r1

concurrency:
  group: alpha-system-convergence-audit
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - run: npx prisma generate --config backend/prisma.config.ts
      - run: npm run build:shared
      - name: Map and Conflict regression tests
        run: |
          npm test --workspace=frontend -- --runInBand src/lib/map/d1/conflictDomainBind.spec.ts
          npm test --workspace=frontend -- --runInBand src/components/map/checkpointELayerReasons.spec.ts
          npm test --workspace=frontend -- --runInBand src/lib/map/reference/referenceGeography.spec.ts
          npm test --workspace=frontend -- --runInBand src/lib/energy/energyVisualFrame.spec.ts
          npm test --workspace=frontend -- --runInBand src/lib/market/mktReader.spec.ts
          npm test --workspace=frontend -- --runInBand src/lib/market/mktContract.spec.ts
          npm test --workspace=frontend -- --runInBand src/components/home/HomepageSituationMap.spec.ts
      - name: Frontend build
        run: npm run build:frontend
      - name: Backend build
        run: npm run build:backend
