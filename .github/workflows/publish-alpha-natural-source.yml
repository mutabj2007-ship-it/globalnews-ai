name: Publish Alpha natural-source correction

on:
  push:
    branches:
      - transport/alpha-c907-natural-source-publish-20260914
    paths:
      - '.github/workflows/publish-alpha-natural-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout transport branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct, verify, and publish exact C907 child
        shell: bash
        run: |
          set -euo pipefail

          BASE_COMMIT='e7dbef5d236c3da0d96e0047abd482b733b78856'
          FINAL_BRANCH='release/alpha-c907-r2-natural-source1'
          EXPECTED_DELTA_SHA='b8e9cdb9dfc599d3fe6d3ee84144ac84e20e821a98f437b9f4189539e088dab2'

          cat transport_payload/natural-source/part{00..12} > /tmp/natural-source-delta.b64
          base64 --decode /tmp/natural-source-delta.b64 > /tmp/natural-source-delta.tar.xz
          echo "${EXPECTED_DELTA_SHA}  /tmp/natural-source-delta.tar.xz" | sha256sum -c -

          cat > /tmp/expected-files.txt <<'EOF'
          backend/src/modules/analysis/query/derive-source-attributed-query.util.ts
          backend/src/modules/analysis/service/analysis.service.ts
          backend/src/modules/analysis/service/source-attributed-fail-closed.spec.ts
          backend/src/modules/analysis/service/source-attributed-question.spec.ts
          backend/src/modules/analysis/service/source-attributed-region-precedence.spec.ts
          backend/src/modules/news/identity/requested-source.util.ts
          backend/src/modules/news/news.service.source-constraint-dedup.spec.ts
          backend/src/modules/news/news.service.source-constraint-tier.spec.ts
          backend/src/modules/news/news.service.ts
          EOF
          sort -o /tmp/expected-files.txt /tmp/expected-files.txt
          tar -tJf /tmp/natural-source-delta.tar.xz | sed '/\/$/d' | sort > /tmp/archive-files.txt
          diff -u /tmp/expected-files.txt /tmp/archive-files.txt
          test "$(wc -l < /tmp/archive-files.txt | tr -d ' ')" = '9'

          git fetch origin "${BASE_COMMIT}"
          git cat-file -e "${BASE_COMMIT}^{commit}"

          REMOTE_FINAL="$(git ls-remote --heads origin "refs/heads/${FINAL_BRANCH}" | awk '{print $1}')"
          test "${REMOTE_FINAL}" = "${BASE_COMMIT}"

          git checkout --detach "${BASE_COMMIT}"
          git config core.fileMode false
          tar -xJf /tmp/natural-source-delta.tar.xz

          cat > /tmp/expected-sha256.txt <<'EOF'
          fdfd1a0fed42d27b501812756166cd49a1691ee0ba3c534d76fd938a9dd86196  backend/src/modules/news/news.service.ts
          9d2b59942f89454b6f94c213a1a8f53f4cdc04169eaedc623c7be765e3a717ed  backend/src/modules/news/news.service.source-constraint-tier.spec.ts
          e33a9afbaea1dfda9a0dd2243c45b550d327fc05032301682447ab853b62f71c  backend/src/modules/news/news.service.source-constraint-dedup.spec.ts
          08994f5a4e9e55869e2e054e63da573fe192ce715469ff28cee107ee260e8960  backend/src/modules/news/identity/requested-source.util.ts
          61736129a6317bf8fe5699c8c7a82c479c023dcda13164ada1c52a6853dd4a0d  backend/src/modules/analysis/service/analysis.service.ts
          a05bbb343d0bc94c8d68a7b42a66a7e90715fb45a56f9bb7791664b56bde0f7b  backend/src/modules/analysis/service/source-attributed-question.spec.ts
          98a2db9fa78a473351e9903c72b1a9b4a02d9898e5e80bc48da818173da02664  backend/src/modules/analysis/service/source-attributed-region-precedence.spec.ts
          0e027a5a1290a60eca04bfebe32bfd08adbf156f265f602b721cee12cb918baa  backend/src/modules/analysis/service/source-attributed-fail-closed.spec.ts
          667af14c171f91bc068390995c99485206bd7d734a55205f24967bc7c3579e44  backend/src/modules/analysis/query/derive-source-attributed-query.util.ts
          EOF
          sha256sum -c /tmp/expected-sha256.txt

          git add -A
          git diff --cached --name-only | sort > /tmp/changed-files.txt
          diff -u /tmp/expected-files.txt /tmp/changed-files.txt
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = '9'
          test -z "$(git diff --cached --diff-filter=D --name-only)"

          git config user.name 'GlobalNewsAI Release Bot'
          git config user.email 'release-bot@globalnewsai.invalid'
          git commit -m 'release(alpha): natural source-attributed question correction'

          NEW_COMMIT="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "${BASE_COMMIT}"
          echo "Published commit candidate: ${NEW_COMMIT}"

          git push --force-with-lease="refs/heads/${FINAL_BRANCH}:${BASE_COMMIT}" origin "HEAD:refs/heads/${FINAL_BRANCH}"
