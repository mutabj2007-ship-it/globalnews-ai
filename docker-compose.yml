services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: globalnews-ai-backend
    ports:
      - '${BACKEND_PORT:-4000}:4000'
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=4000
      - FRONTEND_ORIGIN=http://localhost:${FRONTEND_PORT:-3000}
      - GNEWS_API_KEY=${GNEWS_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:4000/health']
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: globalnews-ai-frontend
    ports:
      - '${FRONTEND_PORT:-3000}:3000'
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - NEXT_PUBLIC_API_URL=http://localhost:${BACKEND_PORT:-4000}
    depends_on:
      - backend
