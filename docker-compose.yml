services:
  postgres:
    image: postgres:16-alpine
    container_name: globalnews-ai-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-globalnews_ai_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change_me}
      - POSTGRES_DB=${POSTGRES_DB:-globalnews_ai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-globalnews_ai_user} -d ${POSTGRES_DB:-globalnews_ai}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: globalnews-ai-backend
    ports:
      - '${BACKEND_PORT:-4000}:4000'
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=4000
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-http://localhost:${FRONTEND_PORT:-3000}}
      - GNEWS_API_KEY=${GNEWS_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      # Milestone B3 — optional Google OAuth/OIDC credentials for the
      # sign-in flow. Passed ONLY as backend container runtime
      # environment variables (never into a Docker build ARG/ENV,
      # unlike NEXT_PUBLIC_API_URL below) since these include real
      # secrets (OAUTH_CLIENT_SECRET, OAUTH_FLOW_SECRET) that must
      # never be baked into an image layer. Empty-string defaults
      # preserve today's guest-mode-only behavior unchanged when
      # unset — auth.service.ts's startGoogleAuth() already fails
      # closed with a 503 on sign-in specifically when these are
      # absent; every other browse/search/map/analysis capability is
      # unaffected either way.
      - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID:-}
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET:-}
      - OAUTH_FLOW_SECRET=${OAUTH_FLOW_SECRET:-}
      # Milestone #54 — points at the Compose service hostname
      # ('postgres'), not localhost: containers on the same Compose
      # network resolve each other by service name. Credentials are
      # sourced from the SAME env vars (with the same non-secret
      # dev-only defaults) as the postgres service above, so they can
      # never drift apart; a real deployment overrides
      # POSTGRES_USER/POSTGRES_PASSWORD/POSTGRES_DB (or DATABASE_URL
      # directly) via its own environment, never by editing this file.
      - DATABASE_URL=postgresql://${POSTGRES_USER:-globalnews_ai_user}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-globalnews_ai}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    # Milestone #54 — points at /health/ready (not /health): for this
    # single-instance Compose stack, "healthy" should mean "actually
    # able to serve real traffic" (i.e. database reachable), which is
    # what gates docker compose ps's reported status and any future
    # depends_on: condition: service_healthy on this service. /health
    # itself (liveness only, no DB dependency) remains available for
    # a future orchestrator that wants a separate, DB-independent
    # liveness signal.
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:4000/health/ready']
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      # Milestone B3 — NEXT_PUBLIC_API_URL must reach the frontend
      # BUILD (Next.js inlines public env vars into the compiled
      # bundle at build time, not read at container runtime — see
      # frontend/Dockerfile's own comment). The `environment:` entry
      # below was, before this change, the ONLY place this value was
      # ever supplied — too late to affect the already-built image.
      # Same default as before (unchanged local-dev behavior); a real
      # deployment sets NEXT_PUBLIC_API_URL in its own environment to
      # override it. No production URL invented here.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${BACKEND_PORT:-4000}}
    container_name: globalnews-ai-frontend
    ports:
      - '${FRONTEND_PORT:-3000}:3000'
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - NEXT_PUBLIC_API_URL=http://localhost:${BACKEND_PORT:-4000}
    depends_on:
      - backend

volumes:
  postgres_data:
